name: ci

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q zed_pkg_insights zed_sublimetext.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build deterministic Sublime Text package
        run: python scripts/build-package.py
      - name: Verify package archive
        run: python -m unittest tests.test_package_build -v
      - name: Publish package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZedPackageInsights-${{ github.sha }}
          path: dist/ZedPackageInsights.sublime-package
          if-no-files-found: error
          retention-days: 30
